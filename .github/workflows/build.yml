name: Build Fly APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter create fly_app
      - run: |
          cd fly_app
          flutter build apk --release
      - uses: actions/upload-artifact@v3
        with:
          name: fly-release-apk
          path: fly_app/build/app/outputs/flutter-apk/app-release.apk
